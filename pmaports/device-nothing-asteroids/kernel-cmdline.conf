# Appended to the kernel command line by postmarketOS. Keep this minimal: it
# ships to every user of the device package, so it must not contain bring-up
# crutches. The crutches that were in the scaffold (maxcpus=1, cpuidle.off=1,
# clk_ignore_unused, pd_ignore_unused, regulator_ignore_unused, acpi=off,
# loglevel=4, nokaslr) hide missing clock/power-domain providers and cap the
# device to a single CPU. Keep those in a local kernel-cmdline override while
# bringing subsystems up, not here.
console=tty0
console=ttyMSM0,115200n8
