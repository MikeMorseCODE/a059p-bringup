name: APK package

# Builds the aport that `make apk` generates inside an Alpine container and
# fails on the three things building by hand would not catch:
#   * the generated APKBUILD drifting from packaging/APKBUILD.in
#   * pkgver or sha512sums no longer matching VERSION and the tarball
#   * the built .apk installing a different layout than `make install`
#
# abuild refuses to run as root, so the container gets a builder user and a
# copy of the tree that user owns. The runner itself installs nothing Alpine
# specific; the whole job is one docker run.
#
# ci/apk.sh is the checker. Run it locally for the integrity half:
#   sh ci/apk.sh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aport:
    name: make apk + abuild
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the aport and build it with abuild
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -e PACKAGER="ci <ci@example.invalid>" \
            alpine:3.20 sh -euc "
              apk add --no-cache alpine-sdk mtools dosfstools python3 dtc make >/dev/null
              adduser -D builder
              addgroup builder abuild
              su builder -s /bin/sh -c 'abuild-keygen -a -n -q'
              cp /home/builder/.abuild/*.pub /etc/apk/keys/
              cp -a /src /work
              chown -R builder /work
              su builder -s /bin/sh -c 'cd /work && sh ci/apk.sh --abuild'
            "
